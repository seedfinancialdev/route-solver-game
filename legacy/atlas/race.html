<!doctype html>
<meta charset="utf-8">
<title>Race — Atlas</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="./vendor/maplibre-gl.css">
<style>
  html, body { margin: 0; height: 100%; background: #0a1119; }
  #map { position: absolute; inset: 0; }
  .panel { position: absolute; z-index: 2; background: rgba(12,18,26,.92); color: #eef2f6;
    border: 1px solid rgba(255,255,255,.09); border-radius: 10px; backdrop-filter: blur(12px);
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  a { color: inherit; }
  button, select { font: inherit; color: inherit; }
  .mono { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }

  #back { left: 12px; top: 12px; padding: 8px 12px; font-size: 12px; text-decoration: none; }
  #back:hover { border-color: rgba(255,255,255,.3); }

  #plan { right: 12px; top: 12px; width: 320px; max-height: calc(100vh - 24px); overflow-y: auto;
    padding: 14px 15px; }
  #plan h1 { font-size: 15px; margin: 0 0 2px; font-weight: 600; }
  #plan .day { font-size: 11px; color: #93a1b0; margin-bottom: 12px; }

  .sec { margin-bottom: 13px; }
  .sec h2 { font-size: 10px; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .07em; color: #93a1b0; }

  .incidents { display: flex; flex-direction: column; gap: 5px; }
  .incident { font-size: 11.5px; color: #ffb199; }
  .incident .route { color: #ff8a70; font-weight: 600; }
  .incidents .none { color: #5c6a76; font-size: 11.5px; }

  .order-line { font-size: 12px; color: #93a1b0; }
  .order-line b { color: #eef2f6; }
  .hint { font-size: 11px; color: #5c6a76; margin-top: 3px; }

  .car-row .desc { font-size: 12.5px; }
  .car-row .desc b { font-weight: 600; }
  .car-row a.change { font-size: 11.5px; color: #93a1b0; border: 1px solid rgba(255,255,255,.16);
    border-radius: 6px; padding: 3px 8px; text-decoration: none; margin-left: 6px; }
  .car-row a.change:hover { color: #eef2f6; }
  .car-row .none { color: #ff8a70; font-size: 12px; }

  select#departHour { background: #0f151c; color: #eef2f6; border: 1px solid rgba(255,255,255,.16);
    border-radius: 6px; padding: 5px 8px; width: 100%; }

  .go { background: #4ade80; color: #0a1119; border: none; border-radius: 8px; padding: 9px 0; width: 100%;
    font-size: 13px; font-weight: 700; cursor: pointer; }
  .go:disabled { background: rgba(255,255,255,.08); color: #5c6a76; cursor: not-allowed; }
  .go:hover:not(:disabled) { background: #6ee89c; }
  .go-note { font-size: 11px; color: #93a1b0; margin-top: 5px; }

  .result { display: none; border-top: 1px solid rgba(255,255,255,.1); padding-top: 12px; margin-top: 4px; }
  .result[data-shown="true"] { display: block; }
  .result-headline { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .result-time { font-size: 22px; font-weight: 700; font-family: ui-monospace, monospace; }
  .medal { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 5px; text-transform: uppercase;
    letter-spacing: .04em; }
  .medal[data-tier="record"] { background: rgba(74,222,128,.16); color: #4ade80; }
  .medal[data-tier="gold"] { background: rgba(224,165,60,.16); color: #e0a53c; }
  .medal[data-tier="silver"] { background: rgba(147,161,176,.2); color: #cdd5db; }
  .medal[data-tier="bronze"] { background: rgba(184,115,51,.18); color: #cd8c5c; }
  .medal[data-tier="none"] { background: rgba(232,80,58,.14); color: #ff8a70; }

  .targets { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: #93a1b0; margin-bottom: 10px; }
  .targets b { color: #eef2f6; }

  table.legs { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  table.legs td { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,.06); vertical-align: top; }
  table.legs td.num { text-align: right; font-family: ui-monospace, monospace; white-space: nowrap; }
  table.legs tr[data-incident="true"] td { color: #ff8a70; }
  table.legs .note { display: block; font-size: 10.5px; color: #ff8a70; }
  table.legs tr[data-detoured="true"] td:first-child { color: #facc15; }
  .reset-detour { font-size: 10px; color: #93a1b0; text-decoration: underline; cursor: pointer; margin-left: 6px; }
  .reset-detour:hover { color: #eef2f6; }
  .drag-hint { font-size: 10.5px; color: #5c6a76; margin-top: 6px; }

  /* pins */
  /* 34px, not the 26px this started at: a candidate sits in a field of
     lookalike dots from the base map (other cities, other layers), and a
     small circle there is easy to miss with a real mouse even though a
     scripted click always lands dead center. Bigger target, same idea. */
  .pin { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #0a1119; border: 2px solid rgba(10,17,25,.9); cursor: pointer;
    background: #cdd5db; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .pin[data-role="fixed"] { background: #4ade80; cursor: default; }
  .pin[data-role="fixed"][data-fixed="finish"] { background: #f43f5e; }
  .pin[data-role="candidate"][data-picked="true"] { background: #4ade80; }
  .pin[data-role="candidate"][data-picked="false"][data-full="true"] { opacity: .5; cursor: not-allowed; }
  .pin-label { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 3px;
    font-size: 10px; color: #eef2f6; background: rgba(10,17,25,.85); padding: 1px 5px; border-radius: 3px;
    white-space: nowrap; pointer-events: none; }

  #err { display: none; position: absolute; z-index: 9; left: 12px; top: 60px; right: 350px;
    padding: 11px 13px; border-radius: 10px; background: #45161a; color: #ffd9d2;
    border: 1px solid #7d2a2a; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>

<div id="map"></div>
<a class="panel" id="back" href="./index.html">&larr; map</a>
<div id="err"></div>

<div class="panel" id="plan">
  <h1 id="raceName">Race</h1>
  <div class="day mono" id="dayBadge"></div>

  <div class="sec">
    <h2>Today's conditions</h2>
    <div class="incidents" id="incidents"></div>
  </div>

  <div class="sec">
    <h2 id="pickHeading">Checkpoints</h2>
    <div class="order-line" id="orderLine"></div>
    <div class="hint">Click pins on the map, in the order you want to drive them.</div>
  </div>

  <div class="sec car-row" id="carRow"></div>

  <div class="sec">
    <h2>Departure</h2>
    <select id="departHour"></select>
  </div>

  <div class="sec">
    <button class="go" id="goBtn" disabled type="button">Resolve</button>
    <div class="go-note" id="goNote"></div>
  </div>

  <div class="result" id="result">
    <div class="result-headline">
      <span class="result-time mono" id="resultTime"></span>
      <span class="medal" id="medalBadge"></span>
    </div>
    <div class="targets" id="targets"></div>
    <table class="legs"><tbody id="legRows"></tbody></table>
    <div class="drag-hint">Don't trust a leg? Drag it on the map, like you would in Google Maps.</div>
  </div>
</div>

<script src="./vendor/maplibre-gl.js"></script>
<script src="./style.js"></script>
<script>
(function () {
  "use strict";
  var STORAGE_KEY = "garage-selection";
  var picked = []; // candidate names, in click order
  var markers = {}; // name -> maplibregl.Marker

  var fail = function (msg) {
    var el = document.getElementById("err");
    el.style.display = "block"; el.textContent = msg;
    console.error("[race]", msg);
  };

  if (!window.ATLAS_STYLE) { fail("style.js did not load."); return; }

  var map = new maplibregl.Map({
    container: "map", style: window.ATLAS_STYLE,
    center: [12, 47], zoom: 4.4, maxZoom: 15, attributionControl: { compact: true },
  });
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "bottom-right");
  map.on("error", function (e) {
    var msg = e && e.error ? e.error.message : String(e);
    if (/style|expression|layer|source/i.test(msg)) fail("Style error: " + msg);
  });

  // Markers and fitBounds() need the map's container to have its FINAL
  // measured size before any bounds math runs — "load" fires once the style
  // is ready, but not necessarily after layout/resize have settled, and
  // fitBounds computed against a stale container size is what put pins at
  // wrong screen positions intermittently (self-correcting only once a LATER
  // fitBounds, from resolving a route, happened to run). "idle" is the event
  // MapLibre itself documents as "everything has settled" — wait for that,
  // and force a resize first in case the container changed size after the
  // map measured it.
  var mapReady = new Promise(function (resolve) {
    map.resize();
    if (map.loaded()) resolve(); else map.once("idle", resolve);
  });
  var raceLoaded = fetch("./race.json").then(function (r) { return r.json(); });

  Promise.all([raceLoaded, mapReady]).then(function (results) {
    var race = results[0];

    // The base style also draws the career runs (cape-to-cape, the Britain
    // circuit, ...) for index.html's exploratory map — their corridors and
    // endpoint pins have nothing to do with the race being planned here, and
    // sitting on top of it they're just clutter that makes it harder to find
    // and click this race's own checkpoints. Hide them on this page only.
    ["route-halo", "route-alt", "route-best", "run-ends", "run-labels"].forEach(function (id) {
      if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", "none");
    });

    document.getElementById("raceName").textContent = race.name;
    document.getElementById("dayBadge").textContent = race.day || "no date set";
    document.getElementById("pickHeading").textContent = "Checkpoints — pick " + race.pick + " of " + race.candidates.length;

    var incidentsEl = document.getElementById("incidents");
    if (!race.incidents.length) {
      incidentsEl.innerHTML = "<span class='none'>Nothing reported.</span>";
    } else {
      race.incidents.forEach(function (inc) {
        var row = document.createElement("div");
        row.className = "incident";
        row.innerHTML = "<span class='route'>" + inc.from + " &harr; " + inc.to + "</span> " + inc.note;
        incidentsEl.appendChild(row);
      });
    }

    var goBtn = document.getElementById("goBtn");
    var goNote = document.getElementById("goNote");
    function readCarSelection() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); } catch (e) { return null; }
    }
    function updateGoState() {
      var sel = readCarSelection();
      var ready = picked.length === race.pick && !!sel;
      goBtn.disabled = !ready;
      goNote.textContent = ready ? "" : picked.length !== race.pick
        ? ("pick " + (race.pick - picked.length) + " more checkpoint" + (race.pick - picked.length === 1 ? "" : "s"))
        : "choose a car first";
    }

    function pinEl(label, role, fixedRole) {
      // `wrap` is the element handed to maplibregl.Marker — it MUST stay
      // exactly as MapLibre's own stylesheet leaves it (position: absolute,
      // positioned via a transform from the map's origin). Setting
      // position:relative directly on it here — the first version of this
      // function did — made an inline style beat that stylesheet rule, so
      // every marker's transform ran from its normal document-flow resting
      // position instead of the map's (0,0), a fixed, silent, and completely
      // reproducible offset rather than a timing bug. `.pin-label` still
      // needs a `position: relative` ANCHOR to anchor its own `position:
      // absolute` below the pin, so that goes on a plain inner div instead.
      var wrap = document.createElement("div");
      var anchor = document.createElement("div");
      anchor.style.position = "relative";
      var el = document.createElement("div");
      el.className = "pin"; el.dataset.role = role;
      if (fixedRole) el.dataset.fixed = fixedRole;
      el.textContent = label;
      var tag = document.createElement("div");
      tag.className = "pin-label";
      anchor.appendChild(el); anchor.appendChild(tag);
      wrap.appendChild(anchor);
      return { wrap: wrap, dot: el, tag: tag };
    }

    function renderOrderLine() {
      var line = document.getElementById("orderLine");
      line.innerHTML = picked.length
        ? "<b>" + [race.from.name].concat(picked).concat([race.to.name]).join(" &rarr; ") + "</b>"
        : "Nothing picked yet.";
      updateGoState();
    }

    function refreshCandidatePins() {
      race.candidates.forEach(function (c) {
        var idx = picked.indexOf(c.name);
        var m = markers[c.name];
        m.dot.dataset.picked = idx !== -1 ? "true" : "false";
        m.dot.dataset.full = idx === -1 && picked.length >= race.pick ? "true" : "false";
        m.dot.textContent = idx !== -1 ? String(idx + 1) : "";
        m.tag.textContent = c.name;
      });
      renderOrderLine();
    }

    function addAllPins() {
      // start / finish, fixed
      var fromPin = pinEl("A", "fixed", "start");
      fromPin.tag.textContent = race.from.name;
      new maplibregl.Marker({ element: fromPin.wrap, anchor: "center" }).setLngLat([race.from.lon, race.from.lat]).addTo(map);
      var toPin = pinEl("B", "fixed", "finish");
      toPin.tag.textContent = race.to.name;
      new maplibregl.Marker({ element: toPin.wrap, anchor: "center" }).setLngLat([race.to.lon, race.to.lat]).addTo(map);

      // candidates, clickable
      race.candidates.forEach(function (c) {
        var m = pinEl("", "candidate");
        m.dot.addEventListener("click", function () {
          var idx = picked.indexOf(c.name);
          if (idx !== -1) picked.splice(idx, 1);
          else if (picked.length < race.pick) picked.push(c.name);
          refreshCandidatePins();
        });
        markers[c.name] = m;
        new maplibregl.Marker({ element: m.wrap, anchor: "center" }).setLngLat([c.lon, c.lat]).addTo(map);
      });
      refreshCandidatePins();
    }

    // Fit the map to every stop on the menu, then add markers once the camera
    // has settled — avoids a visible flash of markers at the pre-fit position.
    var bounds = new maplibregl.LngLatBounds();
    bounds.extend([race.from.lon, race.from.lat]);
    bounds.extend([race.to.lon, race.to.lat]);
    race.candidates.forEach(function (c) { bounds.extend([c.lon, c.lat]); });
    map.once("moveend", addAllPins);
    map.fitBounds(bounds, { padding: 90, duration: 0 });

    var hourSel = document.getElementById("departHour");
    for (var h = 0; h < 24; h++) {
      var opt = document.createElement("option");
      opt.value = h; opt.textContent = String(h).padStart(2, "0") + ":00";
      if (h === 9) opt.selected = true;
      hourSel.appendChild(opt);
    }

    var carRow = document.getElementById("carRow");
    function renderCar() {
      var sel = readCarSelection();
      if (!sel) {
        carRow.innerHTML = "<span class='none'>No car selected.</span>"
          + "<a class='change' href='./garage.html'>Choose &rarr;</a>";
      } else {
        carRow.innerHTML = "<span class='desc'>Driving <b>" + sel.carId + "</b>"
          + (sel.mods && sel.mods.length ? " (" + sel.mods.join(", ") + ")" : " (stock)") + "</span>"
          + "<a class='change' href='./garage.html'>Change &rarr;</a>";
      }
      updateGoState();
    }
    renderCar();
    window.addEventListener("storage", renderCar);

    var hm = function (m) { return Math.floor(m / 60) + "h" + String(Math.round(m % 60)).padStart(2, "0"); };

    // currentStops/currentDetours are what a drag builds on: the leg
    // endpoints a drag needs (fixed, from the plan) and the detour map the
    // next resolve should carry forward. Reset only when the Resolve button
    // starts an entirely new plan; a drag or a reset updates them in place.
    var currentStops = null;
    var currentDetours = {};
    var dragging = null; // { legIndex, from: [lon,lat], to: [lon,lat] }

    function drawRoute(legs) {
      var clearCoords = [], incidentCoords = [];
      legs.forEach(function (leg, idx) {
        (leg.incidentMinutes > 0 ? incidentCoords : clearCoords).push({
          type: "Feature", properties: { legIndex: idx },
          geometry: { type: "LineString", coordinates: leg.coordinates },
        });
      });
      var data = function (feats) { return { type: "FeatureCollection", features: feats }; };
      if (map.getSource("resolved-clear")) {
        map.getSource("resolved-clear").setData(data(clearCoords));
        map.getSource("resolved-incident").setData(data(incidentCoords));
      } else {
        map.addSource("resolved-clear", { type: "geojson", data: data(clearCoords) });
        map.addSource("resolved-incident", { type: "geojson", data: data(incidentCoords) });
        map.addLayer({ id: "resolved-clear-halo", type: "line", source: "resolved-clear",
          paint: { "line-color": "#0b1016", "line-width": 6, "line-opacity": .6 } });
        map.addLayer({ id: "resolved-clear-line", type: "line", source: "resolved-clear",
          paint: { "line-color": "#4ade80", "line-width": 3 } });
        map.addLayer({ id: "resolved-incident-halo", type: "line", source: "resolved-incident",
          paint: { "line-color": "#0b1016", "line-width": 6, "line-opacity": .6 } });
        map.addLayer({ id: "resolved-incident-line", type: "line", source: "resolved-incident",
          paint: { "line-color": "#ff8a70", "line-width": 3, "line-dasharray": [1.5, 1.2] } });

        // The route is draggable the instant it exists — grab either line
        // layer, drag, drop, and that leg is forced through the drop point.
        // Bound once here (addLayer only runs once), not inside drawRoute,
        // which reruns on every resolve and would otherwise stack handlers.
        ["resolved-clear-line", "resolved-incident-line"].forEach(function (id) {
          map.on("mousedown", id, function (e) {
            if (!e.features.length) return;
            startDrag(e.features[0].properties.legIndex, [e.lngLat.lng, e.lngLat.lat]);
          });
          map.on("mouseenter", id, function () { if (!dragging) map.getCanvas().style.cursor = "grab"; });
          map.on("mouseleave", id, function () { if (!dragging) map.getCanvas().style.cursor = ""; });
        });
        map.on("mousemove", function (e) {
          if (!dragging) return;
          setPreview([e.lngLat.lng, e.lngLat.lat]);
        });
        map.on("mouseup", function (e) {
          if (!dragging) return;
          var legIndex = dragging.legIndex, point = [e.lngLat.lng, e.lngLat.lat];
          endDrag();
          currentDetours[legIndex] = point;
          performResolve(currentStops, currentDetours);
        });
      }
      var routeBounds = new maplibregl.LngLatBounds();
      legs.forEach(function (leg) { leg.coordinates.forEach(function (c) { routeBounds.extend(c); }); });
      map.fitBounds(routeBounds, { padding: 90 });
    }

    // ---- dragging one leg onto a waypoint --------------------------------
    // Live preview is a straight rubber-band line while the cursor moves —
    // no network call per pixel. The real, road-traced reprice (through
    // /resolve, priced by the same traffic + incident model as the default
    // route) only happens once on release. See scripts/lib/resolve.mjs.

    function setPreview(cursorLngLat) {
      var feature = { type: "Feature", properties: {}, geometry: { type: "LineString",
        coordinates: [dragging.from, cursorLngLat, dragging.to] } };
      if (map.getSource("drag-preview")) {
        map.getSource("drag-preview").setData({ type: "FeatureCollection", features: [feature] });
      } else {
        map.addSource("drag-preview", { type: "geojson", data: { type: "FeatureCollection", features: [feature] } });
        map.addLayer({ id: "drag-preview-line", type: "line", source: "drag-preview",
          paint: { "line-color": "#facc15", "line-width": 2, "line-dasharray": [0.2, 1.6] } });
      }
    }

    function startDrag(legIndex, cursorLngLat) {
      dragging = {
        legIndex: legIndex,
        from: [currentStops[legIndex].lon, currentStops[legIndex].lat],
        to: [currentStops[legIndex + 1].lon, currentStops[legIndex + 1].lat],
      };
      map.dragPan.disable();
      map.getCanvas().style.cursor = "grabbing";
      setPreview(cursorLngLat);
    }

    function endDrag() {
      dragging = null;
      map.dragPan.enable();
      map.getCanvas().style.cursor = "";
      if (map.getSource("drag-preview")) map.getSource("drag-preview").setData({ type: "FeatureCollection", features: [] });
    }

    // ---- resolving, shared by the Resolve button, a drag, and a reset ----

    function performResolve(stops, detours) {
      var sel = readCarSelection();
      goBtn.disabled = true; goBtn.textContent = "Resolving…";

      return fetch("/resolve", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          stops: stops, carId: sel.carId, mods: sel.mods || [],
          departMinutes: Number(hourSel.value) * 60, detours: detours,
        }),
      }).then(function (r) { return r.json(); }).then(function (data) {
        goBtn.disabled = false; goBtn.textContent = "Resolve";
        if (!data.ok) {
          document.getElementById("result").dataset.shown = "true";
          document.getElementById("resultTime").textContent = "—";
          document.getElementById("medalBadge").outerHTML = "<span class='none' style='font-size:11.5px'>No route found for that plan.</span>";
          return;
        }

        currentStops = stops;
        currentDetours = detours;

        var tier = "none";
        if (data.totalMinutes <= race.medals.record) tier = "record";
        else if (data.totalMinutes <= race.medals.gold) tier = "gold";
        else if (data.totalMinutes <= race.medals.silver) tier = "silver";
        else if (data.totalMinutes <= race.medals.bronze) tier = "bronze";

        document.getElementById("result").dataset.shown = "true";
        document.getElementById("resultTime").textContent = hm(data.totalMinutes);
        var badge = document.getElementById("medalBadge");
        badge.dataset.tier = tier;
        badge.textContent = tier === "none" ? "No medal" : tier;

        document.getElementById("targets").innerHTML =
          "<span>Record <b>" + hm(race.medals.record) + "</b></span>"
          + "<span>Gold <b>" + hm(race.medals.gold) + "</b></span>"
          + "<span>Silver <b>" + hm(race.medals.silver) + "</b></span>"
          + "<span>Bronze <b>" + hm(race.medals.bronze) + "</b></span>";

        var rows = document.getElementById("legRows");
        rows.innerHTML = "";
        data.legs.forEach(function (leg, idx) {
          var tr = document.createElement("tr");
          tr.dataset.incident = leg.incidentMinutes > 0 ? "true" : "false";
          tr.dataset.detoured = leg.viaWaypoint ? "true" : "false";
          var reset = leg.viaWaypoint ? " <a class='reset-detour' data-leg='" + idx + "'>reset</a>" : "";
          tr.innerHTML = "<td>" + leg.from + " &rarr; " + leg.to
            + (leg.incidentNote ? "<span class='note'>+" + leg.incidentMinutes + "min — " + leg.incidentNote + "</span>" : "")
            + reset + "</td>"
            + "<td class='num'>" + hm(leg.minutes) + "</td>";
          rows.appendChild(tr);
        });
        rows.querySelectorAll(".reset-detour").forEach(function (link) {
          link.addEventListener("click", function () {
            var next = Object.assign({}, currentDetours);
            delete next[Number(link.dataset.leg)];
            performResolve(currentStops, next);
          });
        });

        drawRoute(data.legs);
      }).catch(function (err) {
        goBtn.disabled = false; goBtn.textContent = "Resolve";
        goNote.textContent = "Resolve failed: " + err;
      });
    }

    goBtn.addEventListener("click", function () {
      var stops = [race.from].concat(
        picked.map(function (name) { return race.candidates.find(function (c) { return c.name === name; }); })
      ).concat([race.to]);
      // A fresh Resolve is a new plan — any detour belonged to the old leg
      // structure and should not silently carry forward onto a different one.
      performResolve(stops, {});
    });
  }).catch(function (err) {
    fail("Could not load race.json — run node legacy/atlas/build-race.mjs first. " + err);
  });
})();
</script>
