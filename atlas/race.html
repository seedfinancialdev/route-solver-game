<!doctype html>
<meta charset="utf-8">
<title>Race — Atlas</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { margin: 0; min-height: 100%; background: #0a1119; color: #eef2f6;
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  .mono { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }

  header { position: sticky; top: 0; z-index: 3; display: flex; flex-wrap: wrap; gap: 10px 20px;
    align-items: center; padding: 12px 16px; background: rgba(10,17,25,.94);
    border-bottom: 1px solid rgba(255,255,255,.09); backdrop-filter: blur(12px); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .01em; }
  header .back { font-size: 12px; color: #93a1b0; text-decoration: none; border: 1px solid rgba(255,255,255,.14);
    border-radius: 6px; padding: 4px 9px; }
  header .back:hover { color: #eef2f6; border-color: rgba(255,255,255,.3); }
  header .day { font-size: 12px; color: #93a1b0; padding: 3px 10px; border-radius: 5px;
    border: 1px solid rgba(255,255,255,.12); }

  main { padding: 16px 16px 60px; max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  .panel { background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.09); border-radius: 10px;
    padding: 14px 16px; }
  .panel h2 { font-size: 12px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .06em; color: #93a1b0; }

  .incidents { display: flex; flex-direction: column; gap: 6px; }
  .incident { font-size: 12.5px; color: #ffb199; display: flex; gap: 8px; }
  .incident .route { color: #ff8a70; font-weight: 600; white-space: nowrap; }
  .incidents .none { color: #5c6a76; font-size: 12.5px; }

  .stop-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; }
  .stop-row .fixed { color: #93a1b0; }
  .stop-row .name { font-weight: 600; }

  .candidates { display: flex; flex-wrap: wrap; gap: 7px; }
  .cand { position: relative; font-size: 12.5px; padding: 7px 12px; border-radius: 7px;
    border: 1px solid rgba(255,255,255,.16); background: transparent; color: #cdd5db; cursor: pointer; }
  .cand .num { display: inline-block; width: 16px; height: 16px; line-height: 16px; border-radius: 50%;
    background: #4ade80; color: #0a1119; font-size: 10px; font-weight: 700; text-align: center; margin-right: 6px; }
  .cand[data-picked="true"] { border-color: #4ade80; color: #eef2f6; background: rgba(74,222,128,.08); }
  .cand[data-picked="false"][data-disabled="true"] { opacity: .35; cursor: not-allowed; }

  .order-line { margin-top: 10px; font-size: 12.5px; color: #93a1b0; }
  .order-line b { color: #eef2f6; }

  .car-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .car-row .desc { font-size: 13px; }
  .car-row .desc b { font-weight: 600; }
  .car-row a.change { font-size: 12px; color: #93a1b0; border: 1px solid rgba(255,255,255,.16);
    border-radius: 6px; padding: 4px 9px; text-decoration: none; }
  .car-row a.change:hover { color: #eef2f6; }
  .car-row .none { color: #ff8a70; font-size: 12.5px; }

  select { background: #0f151c; color: #eef2f6; border: 1px solid rgba(255,255,255,.16); border-radius: 6px;
    padding: 6px 9px; font: inherit; }

  .go-row { display: flex; align-items: center; gap: 12px; }
  .go { background: #4ade80; color: #0a1119; border: none; border-radius: 8px; padding: 10px 22px;
    font-size: 13.5px; font-weight: 700; cursor: pointer; }
  .go:disabled { background: rgba(255,255,255,.08); color: #5c6a76; cursor: not-allowed; }
  .go:hover:not(:disabled) { background: #6ee89c; }
  .go-note { font-size: 12px; color: #93a1b0; }

  .result { display: none; }
  .result[data-shown="true"] { display: block; }
  .result-headline { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
  .result-time { font-size: 30px; font-weight: 700; font-family: ui-monospace, monospace; }
  .medal { font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 6px; text-transform: uppercase;
    letter-spacing: .04em; }
  .medal[data-tier="record"] { background: rgba(74,222,128,.16); color: #4ade80; }
  .medal[data-tier="gold"] { background: rgba(224,165,60,.16); color: #e0a53c; }
  .medal[data-tier="silver"] { background: rgba(147,161,176,.2); color: #cdd5db; }
  .medal[data-tier="bronze"] { background: rgba(184,115,51,.18); color: #cd8c5c; }
  .medal[data-tier="none"] { background: rgba(232,80,58,.14); color: #ff8a70; }

  .targets { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: #93a1b0; margin-bottom: 14px; }
  .targets b { color: #eef2f6; }

  table.legs { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.legs th { text-align: left; color: #5c6a76; font-weight: 500; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: .04em; padding: 4px 8px; border-bottom: 1px solid rgba(255,255,255,.08); }
  table.legs td { padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,.06); }
  table.legs td.num { text-align: right; font-family: ui-monospace, monospace; }
  table.legs tr[data-incident="true"] td { color: #ff8a70; }

  .error { color: #ff8a70; font-size: 12.5px; }
</style>

<header>
  <a class="back" href="./index.html">&larr; map</a>
  <h1 id="raceName">Race</h1>
  <span class="day mono" id="dayBadge"></span>
</header>

<main id="main">
  <div class="panel">
    <h2>Today's conditions</h2>
    <div class="incidents" id="incidents"></div>
  </div>

  <div class="panel">
    <h2 id="pickHeading">Checkpoints</h2>
    <div class="stop-row"><span class="fixed">Start</span> <span class="name" id="fromName"></span></div>
    <div class="candidates" id="candidates"></div>
    <div class="order-line" id="orderLine"></div>
    <div class="stop-row" style="margin-top:10px;"><span class="fixed">Finish</span> <span class="name" id="toName"></span></div>
  </div>

  <div class="panel">
    <h2>Your car</h2>
    <div class="car-row" id="carRow"></div>
  </div>

  <div class="panel">
    <h2>Departure</h2>
    <select id="departHour"></select>
  </div>

  <div class="go-row">
    <button class="go" id="goBtn" disabled type="button">Resolve</button>
    <span class="go-note" id="goNote"></span>
  </div>

  <div class="panel result" id="result">
    <div class="result-headline">
      <span class="result-time mono" id="resultTime"></span>
      <span class="medal" id="medalBadge"></span>
    </div>
    <div class="targets" id="targets"></div>
    <table class="legs">
      <thead><tr><th>Leg</th><th style="text-align:right">Minutes</th><th style="text-align:right">Km</th><th>Note</th></tr></thead>
      <tbody id="legRows"></tbody>
    </table>
  </div>
</main>

<script>
(function () {
  "use strict";
  var STORAGE_KEY = "garage-selection";
  var picked = []; // candidate names, in click order

  fetch("./race.json").then(function (r) { return r.json(); }).then(function (race) {
    document.getElementById("raceName").textContent = race.name;
    document.getElementById("dayBadge").textContent = race.day || "no date set";
    document.getElementById("pickHeading").textContent = "Checkpoints — pick " + race.pick + " of " + race.candidates.length;
    document.getElementById("fromName").textContent = race.from.name;
    document.getElementById("toName").textContent = race.to.name;

    var incidentsEl = document.getElementById("incidents");
    if (!race.incidents.length) {
      incidentsEl.innerHTML = "<span class='none'>Nothing reported.</span>";
    } else {
      race.incidents.forEach(function (inc) {
        var row = document.createElement("div");
        row.className = "incident";
        row.innerHTML = "<span class='route'>" + inc.from + " &harr; " + inc.to + "</span><span>" + inc.note + "</span>";
        incidentsEl.appendChild(row);
      });
    }

    var goBtn = document.getElementById("goBtn");
    var goNote = document.getElementById("goNote");
    function updateGoState() {
      var sel = readCarSelection();
      var ready = picked.length === race.pick && !!sel;
      goBtn.disabled = !ready;
      goNote.textContent = ready ? "" : picked.length !== race.pick
        ? ("pick " + (race.pick - picked.length) + " more checkpoint" + (race.pick - picked.length === 1 ? "" : "s"))
        : "choose a car first";
    }
    function readCarSelection() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); } catch (e) { return null; }
    }

    var candWrap = document.getElementById("candidates");
    function renderCandidates() {
      candWrap.innerHTML = "";
      race.candidates.forEach(function (c) {
        var idx = picked.indexOf(c.name);
        var btn = document.createElement("button");
        btn.type = "button"; btn.className = "cand";
        btn.dataset.picked = idx !== -1 ? "true" : "false";
        btn.dataset.disabled = idx === -1 && picked.length >= race.pick ? "true" : "false";
        btn.innerHTML = (idx !== -1 ? "<span class='num'>" + (idx + 1) + "</span>" : "") + c.name;
        btn.addEventListener("click", function () {
          if (idx !== -1) picked.splice(idx, 1);
          else if (picked.length < race.pick) picked.push(c.name);
          renderCandidates();
        });
        candWrap.appendChild(btn);
      });
      var orderLine = document.getElementById("orderLine");
      orderLine.innerHTML = picked.length
        ? "Order: <b>" + [race.from.name].concat(picked).concat([race.to.name]).join(" &rarr; ") + "</b>"
        : "Click " + race.pick + " checkpoints, in the order you want to drive them.";
      updateGoState();
    }
    renderCandidates();

    var hourSel = document.getElementById("departHour");
    for (var h = 0; h < 24; h++) {
      var opt = document.createElement("option");
      opt.value = h; opt.textContent = String(h).padStart(2, "0") + ":00";
      if (h === 9) opt.selected = true;
      hourSel.appendChild(opt);
    }

    var carRow = document.getElementById("carRow");
    function renderCar() {
      var sel = readCarSelection();
      if (!sel) {
        carRow.innerHTML = "<span class='none'>No car selected.</span> "
          + "<a class='change' href='./garage.html?race=" + encodeURIComponent(race.name) + "&cap=999'>Choose a car &rarr;</a>";
      } else {
        carRow.innerHTML = "<span class='desc'>Driving the <b>" + sel.carId + "</b>"
          + (sel.mods && sel.mods.length ? " (" + sel.mods.join(", ") + ")" : " (stock)") + "</span>"
          + "<a class='change' href='./garage.html'>Change &rarr;</a>";
      }
      updateGoState();
    }
    renderCar();
    window.addEventListener("storage", renderCar); // pick up a change made in another tab

    var hm = function (m) { return Math.floor(m / 60) + "h" + String(Math.round(m % 60)).padStart(2, "0"); };

    goBtn.addEventListener("click", function () {
      var sel = readCarSelection();
      var stops = [race.from].concat(
        picked.map(function (name) { return race.candidates.find(function (c) { return c.name === name; }); })
      ).concat([race.to]);
      goBtn.disabled = true;
      goBtn.textContent = "Resolving…";

      fetch("/resolve", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          stops: stops, carId: sel.carId, mods: sel.mods || [],
          departMinutes: Number(hourSel.value) * 60,
          // Today's incidents are not sent — the server reads its own copy.
          // See scripts/serve-atlas.mjs: a client should not be able to say
          // what delays applied today any more than it should say its own time.
        }),
      }).then(function (r) { return r.json(); }).then(function (data) {
        goBtn.disabled = false;
        goBtn.textContent = "Resolve";
        if (!data.ok) {
          document.getElementById("result").dataset.shown = "true";
          document.getElementById("resultTime").textContent = "—";
          document.getElementById("medalBadge").outerHTML = "<span class='error'>No route found for that plan.</span>";
          return;
        }

        var tier = "none";
        if (data.totalMinutes <= race.medals.record) tier = "record";
        else if (data.totalMinutes <= race.medals.gold) tier = "gold";
        else if (data.totalMinutes <= race.medals.silver) tier = "silver";
        else if (data.totalMinutes <= race.medals.bronze) tier = "bronze";

        document.getElementById("result").dataset.shown = "true";
        document.getElementById("resultTime").textContent = hm(data.totalMinutes);
        var badge = document.getElementById("medalBadge");
        badge.dataset.tier = tier;
        badge.textContent = tier === "none" ? "No medal" : tier;

        document.getElementById("targets").innerHTML =
          "<span>Record <b>" + hm(race.medals.record) + "</b></span>"
          + "<span>Gold <b>" + hm(race.medals.gold) + "</b></span>"
          + "<span>Silver <b>" + hm(race.medals.silver) + "</b></span>"
          + "<span>Bronze <b>" + hm(race.medals.bronze) + "</b></span>";

        var rows = document.getElementById("legRows");
        rows.innerHTML = "";
        data.legs.forEach(function (leg) {
          var tr = document.createElement("tr");
          tr.dataset.incident = leg.incidentMinutes > 0 ? "true" : "false";
          tr.innerHTML = "<td>" + leg.from + " &rarr; " + leg.to + "</td>"
            + "<td class='num'>" + hm(leg.minutes) + "</td>"
            + "<td class='num'>" + Math.round(leg.km) + "</td>"
            + "<td>" + (leg.incidentNote ? "+" + leg.incidentMinutes + "min — " + leg.incidentNote : "") + "</td>";
          rows.appendChild(tr);
        });
        document.getElementById("result").scrollIntoView({ behavior: "smooth", block: "start" });
      }).catch(function (err) {
        goBtn.disabled = false;
        goBtn.textContent = "Resolve";
        goNote.textContent = "Resolve failed: " + err;
      });
    });
  }).catch(function (err) {
    document.getElementById("main").innerHTML =
      "<p class='error'>Could not load race.json — run <code>node atlas/build-race.mjs</code> first.<br>" + err + "</p>";
  });
})();
</script>
