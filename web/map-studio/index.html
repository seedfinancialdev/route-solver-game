<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map Studio & Visual Cartography Sandbox — Route</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c1017;
      --panel-bg: rgba(18, 24, 34, 0.88);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #00f0ff;
      --accent-glow: rgba(0, 240, 255, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    #studio-viewport {
      width: 100vw; height: 100vh;
      position: absolute; top: 0; left: 0;
    }

    /* Floating Studio Control Panel */
    .studio-panel {
      position: absolute; top: 20px; right: 20px;
      width: 340px; max-height: calc(100vh - 40px);
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      display: flex; flex-direction: column;
      z-index: 100;
      overflow-y: auto;
    }
    .panel-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--panel-border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .panel-title {
      font-size: 15px; font-weight: 700; letter-spacing: -0.01em;
      display: flex; align-items: center; gap: 8px;
    }
    .panel-title span { color: var(--accent); }
    .fps-badge {
      font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 20px;
      background: rgba(0, 240, 255, 0.15); color: var(--accent);
      border: 1px solid rgba(0, 240, 255, 0.3);
    }
    .panel-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; }

    .control-group { display: flex; flex-direction: column; gap: 8px; }
    .group-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
    
    select, input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }
    select {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--panel-border);
      color: var(--text); padding: 8px 12px; border-radius: 6px;
      font-size: 13px; font-family: inherit; outline: none;
    }

    .toggle-row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 13px; font-weight: 500;
    }
    .slider-row {
      display: flex; flex-direction: column; gap: 4px;
      font-size: 12px;
    }
    .slider-header { display: flex; justify-content: space-between; color: var(--text-muted); }

    /* Switch styling */
    .switch {
      position: relative; display: inline-block; width: 36px; height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.15); transition: .2s; border-radius: 20px;
    }
    .slider:before {
      position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px;
      background-color: white; transition: .2s; border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(16px); }

    /* HUD overlay left */
    .hud-left {
      position: absolute; bottom: 20px; left: 20px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 8px; padding: 12px 16px;
      font-size: 12px; display: flex; gap: 20px; z-index: 100;
    }
    .stat-item { display: flex; flex-direction: column; }
    .stat-value { font-weight: 700; color: var(--text); }
    .stat-lbl { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
  </style>
</head>
<body>

  <!-- Fullscreen Canvas Viewport -->
  <div id="studio-viewport"></div>

  <!-- Floating Control Panel -->
  <div class="studio-panel">
    <div class="panel-header">
      <div class="panel-title"><span>●</span> Map Studio</div>
      <div class="fps-badge" id="fps-counter">60 FPS</div>
    </div>
    <div class="panel-body">

      <!-- Preset Selector -->
      <div class="control-group">
        <div class="group-label">Color Theme Preset</div>
        <select id="preset-select">
          <option value="tacticalDark">Tactical Dark (Default)</option>
          <option value="vintageTopo">Vintage Topo</option>
          <option value="nordicSlate">Nordic Slate</option>
        </select>
      </div>

      <!-- Layer Toggles -->
      <div class="control-group">
        <div class="group-label">Layer Visibility</div>
        
        <div class="toggle-row">
          <span>Terrain Elevation Relief</span>
          <label class="switch"><input type="checkbox" id="toggle-terrain" checked><span class="slider"></span></label>
        </div>

        <div class="toggle-row">
          <span>Water & Lakes</span>
          <label class="switch"><input type="checkbox" id="toggle-water" checked><span class="slider"></span></label>
        </div>

        <div class="toggle-row">
          <span>Urban Footprints</span>
          <label class="switch"><input type="checkbox" id="toggle-farmland" checked><span class="slider"></span></label>
        </div>

        <div class="toggle-row">
          <span>Background Towns</span>
          <label class="switch"><input type="checkbox" id="toggle-forest" checked><span class="slider"></span></label>
        </div>

        <div class="toggle-row">
          <span>Road Networks</span>
          <label class="switch"><input type="checkbox" id="toggle-roads" checked><span class="slider"></span></label>
        </div>

        <div class="toggle-row">
          <span>City Nodes & Labels</span>
          <label class="switch"><input type="checkbox" id="toggle-nodes" checked><span class="slider"></span></label>
        </div>
      </div>

      <!-- Live Sliders -->
      <div class="control-group">
        <div class="group-label">Opacity & Shading</div>
        
        <div class="slider-row">
          <div class="slider-header"><span>Terrain Opacity</span><span id="val-terrain">65%</span></div>
          <input type="range" id="slider-terrain" min="0" max="100" value="65">
        </div>

        <div class="slider-row">
          <div class="slider-header"><span>Water Opacity</span><span id="val-water">100%</span></div>
          <input type="range" id="slider-water" min="0" max="100" value="100">
        </div>

        <div class="slider-row">
          <div class="slider-header"><span>Urban Opacity</span><span id="val-farmland">52%</span></div>
          <input type="range" id="slider-farmland" min="0" max="100" value="52">
        </div>

        <div class="slider-row">
          <div class="slider-header"><span>Town Density Opacity</span><span id="val-forest">75%</span></div>
          <input type="range" id="slider-forest" min="0" max="100" value="75">
        </div>
      </div>

    </div>
  </div>

  <!-- Bottom Left HUD Stats -->
  <div class="hud-left">
    <div class="stat-item">
      <div class="stat-value" id="stat-zoom">4,232 km</div>
      <div class="stat-lbl">Camera Span</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="stat-tier">Overview</div>
      <div class="stat-lbl">LOD Tier</div>
    </div>
  </div>

  <script type="module" src="studio.js"></script>
</body>
</html>
